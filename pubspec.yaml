
name: snaptrieve
description: "Smart Screenshot Organizer"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.2
  phosphoricons_flutter: ^1.1.1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  crypto: ^3.0.8
  share_plus: ^13.3.1
  archive: ^4.6.0
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/snaptrieve_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/snaptrieve_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
